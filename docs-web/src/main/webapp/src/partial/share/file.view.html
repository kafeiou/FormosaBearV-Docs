<div class="text-center">
  <div class="btn-group pull-left">
    <button type="button" class="btn btn-default" ng-click="closeFile()">
      <span class="fas fa-times"></span>
    </button>
  </div>

  <div class="btn-group">
    <button type="button" class="btn btn-default" ng-click="previousFile()">{{ 'file.view.previous' | translate }}</button>
    <button type="button" class="btn btn-default" ng-click="nextFile()">{{ 'file.view.next' | translate }}</button>
  </div>

  <div class="btn-group pull-right">
    <button type="button" class="btn btn-default" ng-if="canDownload(file, document)" ng-click="openFile()">
      <span class="fas fa-download"></span>
    </button>
  </div>
</div>


<div class="text-center" ng-if="$stateParams.fileId">
  <div style="position: relative; display: inline-block; max-width: 100%;">
    <img ng-src="../api/file/{{ $stateParams.fileId }}/data?size=web&share={{ $stateParams.shareId }}" oncontextmenu="return false;" ondragstart="return false;" draggable="false" style="max-width: 100%; height: auto; display: block; user-select: none; -webkit-user-select: none;" />
    <div class="watermark-overlay" ng-if="isWatermarkEnabled()" ng-style="getWatermarkStyle()" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; user-select: none; -webkit-user-select: none; z-index: 5;"></div>
  </div>
</div>
