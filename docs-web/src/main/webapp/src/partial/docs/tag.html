<script type="text/ng-template" id="tag-browse-tree-item">
  <div class="tag-tree-row" ng-class="{ 'tag-tree-active': $stateParams.id == tag.id }">
    <span class="tag-tree-toggle pointer"
          ng-if="hasChildren(tag.id)"
          ng-click="toggleTagExpand(tag.id, $event)">
      <span class="fas" ng-class="{ 'fa-caret-down': isTagExpanded(tag.id), 'fa-caret-right': !isTagExpanded(tag.id) }"></span>
    </span>
    <span class="tag-tree-toggle-placeholder" ng-if="!hasChildren(tag.id)"></span>
    <span class="fas fa-tag" ng-style="{ 'color': tag.color }"></span>
    <a href="#/tag/{{ tag.id }}" ng-click="onTagClick(tag)" ng-class="{ 'active': $stateParams.id == tag.id }">
      {{ tag.name }}
    </a>
    <span class="text-muted small ml-10">
      <span ng-if="hasChildren(tag.id)" class="mr-10" uib-tooltip="{{ 'tag.browse.subtag_count' | translate: { count: getChildrenTags(tag.id).length } }}">
        <span class="far fa-folder"></span> {{ getChildrenTags(tag.id).length }}
      </span>
      <span uib-tooltip="{{ 'document.count' | translate: { count: tag.document_count || 0 } }}">
        <span class="far fa-file-alt"></span> {{ tag.document_count || 0 }}
      </span>
    </span>
  </div>
  <ul class="list-unstyled tag-tree-children" ng-if="hasChildren(tag.id) && isTagExpanded(tag.id)">
    <li ng-repeat="tag in getChildrenTags(tag.id) | orderBy: '+name'" ng-include="'tag-browse-tree-item'"></li>
  </ul>
</script>

<div class="row">
  <div class="col-md-4">
    <div class="well well-3d">
      <div class="clearfix mb-10" ng-if="tags.length > 0">
        <span class="text-muted">
          <span class="fas fa-tags"></span> {{ 'tag.browse.tree_title' | translate }}
        </span>
        <div class="btn-group btn-group-xs pull-right" ng-if="hasAnyNestedTags()">
          <button type="button" class="btn btn-default" ng-click="expandAllTags()" uib-tooltip="{{ 'tag.expand_all' | translate }}">
            <span class="fas fa-plus-square"></span> {{ 'tag.expand_all' | translate }}
          </button>
          <button type="button" class="btn btn-default" ng-click="collapseAllTags()" uib-tooltip="{{ 'tag.collapse_all' | translate }}">
            <span class="fas fa-minus-square"></span> {{ 'tag.collapse_all' | translate }}
          </button>
        </div>
      </div>

      <p class="text-center text-muted well-sm" ng-if="tags.length == 0">
        {{ 'document.no_tags' | translate }}
      </p>

      <ul class="tag-tree">
        <li ng-repeat="tag in getChildrenTags() | orderBy: '+name'" ng-include="'tag-browse-tree-item'"></li>
      </ul>

      <div class="well-3d-background">
        <span class="fas fa-tags"></span>
      </div>
    </div>
  </div>

  <div class="col-md-8">
    <div ui-view="tag"></div>
  </div>
</div>
