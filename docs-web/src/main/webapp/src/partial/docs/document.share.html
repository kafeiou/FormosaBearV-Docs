<div class="modal-header">
  <h3>{{ 'document.share.title' | translate }}</h3>
</div>
<div class="modal-body">
  <div class="form-group">
    <label for="share-result">{{ 'document.share.message' | translate }}</label>
    <input class="form-control" type="text" id="share-result" ng-model="name" />
  </div>
  <div class="checkbox">
    <label>
      <input type="checkbox" ng-model="allowExport" />
      {{ 'document.share.allow_export' | translate }}
    </label>
    <p class="help-block small text-muted" style="margin-top: 4px; margin-bottom: 0;">
      {{ 'document.share.allow_export_help' | translate }}
    </p>
  </div>
</div>
<div class="modal-footer">
  <button ng-click="close(true)" class="btn btn-primary">
    <span class="fas fa-share"></span> {{ 'document.share.submit' | translate }}
  </button>
  <button ng-click="close(false)" class="btn btn-default">{{ 'cancel' | translate }}</button>
</div>
