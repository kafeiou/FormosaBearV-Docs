name: "DAST (OWASP ZAP Baseline)"

on:
  schedule:
    # Weekly scan on Sundays at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap_baseline:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Build and install Maven modules
        run: mvn --batch-mode install -DskipTests

      - name: Start Jetty server in background
        run: |
          mkdir -p "$RUNNER_TEMP/docs-data"
          nohup mvn --batch-mode -pl docs-web jetty:run -Ddocs.home="$RUNNER_TEMP/docs-data" > jetty.log 2>&1 &
          echo "JETTY_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/docs-web/api/app >/dev/null 2>&1; then
              echo "Jetty is ready after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "Jetty failed to start within timeout:"
          cat jetty.log
          exit 1

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://127.0.0.1:8080/docs-web'
          allow_issue_writing: false
          fail_action: false
          artifact_name: 'zap-baseline-report'

      - name: Stop Jetty server
        if: always()
        run: |
          if [ -n "$JETTY_PID" ]; then
            kill "$JETTY_PID" || true
          fi
