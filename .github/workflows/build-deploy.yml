name: Maven Monthly Build

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  build_war:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Configure Maven Central mirror (avoid HTTP 429)
        run: |
          mkdir -p "$HOME/.m2"
          cat <<'EOF' > "$HOME/.m2/settings.xml"
          <settings>
            <mirrors>
              <mirror>
                <id>google-maven-central</id>
                <name>Google Maven Central Mirror</name>
                <url>https://maven-central.storage-download.googleapis.com/maven2</url>
                <mirrorOf>central</mirrorOf>
              </mirror>
            </mirrors>
          </settings>
          EOF

      - name: Build WAR with Maven
        run: |
          for attempt in 1 2 3; do
            if [ "$attempt" -eq 3 ]; then
              echo "Attempt 3: falling back to default Maven Central..."
              rm -f "$HOME/.m2/settings.xml"
            fi
            if mvn --batch-mode -Daether.connector.basic.threads=2 clean package -DskipTests; then
              exit 0
            fi
            echo "Maven build failed on attempt $attempt; retrying in $((attempt * 15))s..."
            sleep $((attempt * 15))
          done
          exit 1

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-web-war
          path: docs-web/target/docs-web-*.war
