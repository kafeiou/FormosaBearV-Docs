name: "CodeQL"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Configure Maven Central mirror (avoid HTTP 429)
        if: matrix.language == 'java-kotlin'
        run: |
          mkdir -p "$HOME/.m2"
          cat <<'EOF' > "$HOME/.m2/settings.xml"
          <settings>
            <mirrors>
              <mirror>
                <id>google-maven-central</id>
                <name>Google Maven Central Mirror</name>
                <url>https://maven-central.storage-download.googleapis.com/maven2</url>
                <mirrorOf>central</mirrorOf>
              </mirror>
            </mirrors>
          </settings>
          EOF

      - name: Build Java modules with Maven
        if: matrix.language == 'java-kotlin'
        run: |
          for attempt in 1 2 3; do
            if [ "$attempt" -eq 3 ]; then
              echo "Attempt 3: falling back to default Maven Central..."
              rm -f "$HOME/.m2/settings.xml"
            fi
            if mvn --batch-mode -Daether.connector.basic.threads=2 clean compile -DskipTests; then
              exit 0
            fi
            echo "Maven build failed on attempt $attempt; retrying in $((attempt * 15))s..."
            sleep $((attempt * 15))
          done
          exit 1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
